[project]
name = "placement"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tatvamjain", email = "tjain_be23@thapar.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
placement = "placement:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
